# ==============================================================================
# LaunchML - Image Prediction Deployment Configuration
# ==============================================================================
# Install:  pip install .
# Run:      launch-ml --model-dir ./model_dir \
#                      --config deploy_config.yaml \
#                      --output-dir ./output
# ==============================================================================

model:
  # model path is provided via --model-dir CLI argument
  framework_hint: pytorch          # optional: pytorch | tensorflow | onnx | transformers
  entrypoint: predict.py           # optional: custom inference entrypoint

api:
  request_schema:
    type: object
    properties:
      image_url:
        type: string
  response_schema:
    type: object
    properties:
      predictions:
        type: array
        items:
          type: object
          properties:
            label:
              type: string
            confidence:
              type: number

deployment:
  backend: auto                      # auto | fastapi | triton | seldon | vertex_ai (auto = AI decides)
  cloud: local                       # gcp | aws | local (local = containerize & run via Docker)
  region: us-central1
  latency_target_ms: 300
  expected_rps: 20
  load_balancer: public
  gpu_required: false

observability:
  enable_metrics: true
  enable_logging: true

llm:
  provider: gemini                 # openai | anthropic | gemini
  model: gemini-2.5-flash
