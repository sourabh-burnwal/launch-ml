[project]
name = "launch-ml"
version = "0.1.0"
description = "LaunchML — AI-driven ML model deployment, from directory to endpoint in one command."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "LaunchML Contributors"},
]
keywords = ["ml", "deployment", "inference", "terraform", "langgraph", "llm", "mlops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "jsonschema>=4.20.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/launch-ml"
Repository = "https://github.com/your-org/launch-ml"
Issues = "https://github.com/your-org/launch-ml/issues"
Changelog = "https://github.com/your-org/launch-ml/blob/main/CHANGELOG.md"

[project.scripts]
launch-ml = "deploy:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "backends*", "utils*", "templates*"]
